<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Komikku Compare - Automated Test Runner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f111a;
      color: #e2e8f0;
      padding: 30px;
      line-height: 1.6;
    }
    h1 { color: #ff5370; }
    .test-box {
      background: #181b26;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }
    .test-item:last-child { border-bottom: none; }
    .pass { color: #10b981; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }
    .summary {
      font-size: 16px;
      font-weight: 600;
      padding: 12px;
      border-radius: 6px;
    }
    .summary.all-passed {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .summary.some-failed {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
  <script src="../lib/pako.min.js"></script>
  <script src="../lib/backup-storage.js"></script>
  <script src="../lib/backup-parser.js"></script>
  <script src="../lib/title-cleaner.js"></script>
  <script src="../lib/matcher.js"></script>
</head>
<body>
  <h1>Komikku Compare Test Suite</h1>
  <div id="results"></div>

  <script>
    const resultsContainer = document.getElementById('results');
    let totalTests = 0;
    let passedTests = 0;

    function renderGroup(title, tests) {
      const box = document.createElement('div');
      box.className = 'test-box';
      const h3 = document.createElement('h3');
      h3.textContent = title;
      box.appendChild(h3);

      for (const t of tests) {
        totalTests++;
        const item = document.createElement('div');
        item.className = 'test-item';
        
        let passed = false;
        try {
          passed = t.fn();
        } catch (e) {
          console.error(e);
          passed = false;
        }

        if (passed) passedTests++;

        item.innerHTML = `
          <span>${t.name}</span>
          <span class="${passed ? 'pass' : 'fail'}">${passed ? '✓ PASS' : '✗ FAIL'}</span>
        `;
        box.appendChild(item);
      }
      resultsContainer.appendChild(box);
    }

    // 1. Title Cleaner Tests
    const titleCleanerTests = [
      {
        name: 'Mangakakalot: "Read One Piece Chapter 1050 - Mangakakalot" -> "one piece"',
        fn: () => TitleCleaner.cleanTabTitle("Read One Piece Chapter 1050 - Mangakakalot", "https://ww6.mangakakalot.tv/") === "one piece"
      },
      {
        name: 'MangaDex (Chapter First): "Ch. 142 - Jujutsu Kaisen - MangaDex" -> "jujutsu kaisen"',
        fn: () => TitleCleaner.cleanTabTitle("Ch. 142 - Jujutsu Kaisen - MangaDex", "https://mangadex.org/chapter/142") === "jujutsu kaisen"
      },
      {
        name: 'Asura Scans: "Solo Leveling Chapter 179 - Asura Scans" -> "solo leveling"',
        fn: () => TitleCleaner.cleanTabTitle("Solo Leveling Chapter 179 - Asura Scans", "https://asuracomics.com/") === "solo leveling"
      },
      {
        name: 'ReadBerserk SEO: "Read Berserk Manga Online in High Quality - ReadBerserk" -> "berserk"',
        fn: () => TitleCleaner.cleanTabTitle("Read Berserk Manga Online in High Quality - ReadBerserk", "https://readberserk.com/") === "berserk"
      },
      {
        name: 'MangaPlus Pipe: "Chainsaw Man Chapter 120 | MangaPlus" -> "chainsaw man"',
        fn: () => TitleCleaner.cleanTabTitle("Chainsaw Man Chapter 120 | MangaPlus", "https://mangaplus.shueisha.co.jp/") === "chainsaw man"
      },
      {
        name: 'WEBTOON Episodes: "Tower of God - Episode 550 [Season 3 Ep. 133] - WEBTOON" -> "tower of god"',
        fn: () => TitleCleaner.cleanTabTitle("Tower of God - Episode 550 [Season 3 Ep. 133] - WEBTOON", "https://www.webtoons.com/") === "tower of god"
      },
      {
        name: 'Manga suffix strip: "Dandadan Manga - Read Dandadan Online For Free" -> "dandadan"',
        fn: () => TitleCleaner.cleanTabTitle("Dandadan Manga - Read Dandadan Online For Free", "https://dandadan.online/") === "dandadan"
      },
      {
        name: 'RAW prefix: "[RAW] Kingdom Chapter 750 - MangaReader" -> "kingdom"',
        fn: () => TitleCleaner.cleanTabTitle("[RAW] Kingdom Chapter 750 - MangaReader", "https://mangareader.to/") === "kingdom"
      },
      {
        name: 'Vol/Ch prefix: "Vol. 1 Ch. 1 - Oshi no Ko - MangaDex" -> "oshi no ko"',
        fn: () => TitleCleaner.cleanTabTitle("Vol. 1 Ch. 1 - Oshi no Ko - MangaDex", "https://mangadex.org/") === "oshi no ko"
      }
    ];

    renderGroup("1. Title Cleaner Specification Tests", titleCleanerTests);

    // 2. Protobuf Encoder/Decoder Test
    // Helper to create synthetic Tachiyomi Protobuf buffer:
    function encodeVarint(val) {
      const bytes = [];
      let v = BigInt(val);
      while (v >= 0x80n) {
        bytes.push(Number((v & 0x7fn) | 0x80n));
        v >>= 7n;
      }
      bytes.push(Number(v & 0x7fn));
      return bytes;
    }

    function createSyntheticBackupBytes(mangaList) {
      const textEncoder = new TextEncoder();
      const backupBytes = [];

      for (const item of mangaList) {
        const mangaPayload = [];

        // Field 2: url (wire type 2 -> tag 0x12)
        const urlBytes = textEncoder.encode(item.url || '/manga/1');
        mangaPayload.push(...encodeVarint((2 << 3) | 2));
        mangaPayload.push(...encodeVarint(urlBytes.length));
        mangaPayload.push(...urlBytes);

        // Field 3: title (wire type 2 -> tag 0x1A)
        const titleBytes = textEncoder.encode(item.title);
        mangaPayload.push(...encodeVarint(0x1a));
        mangaPayload.push(...encodeVarint(titleBytes.length));
        mangaPayload.push(...titleBytes);

        // Field 1: BackupManga inside Backup (tag 0x0A)
        backupBytes.push(...encodeVarint(0x0a));
        backupBytes.push(...encodeVarint(mangaPayload.length));
        backupBytes.push(...mangaPayload);
      }

      return new Uint8Array(backupBytes);
    }

    async function runProtobufTests() {
      const sampleTitles = [
        { title: "One Piece", url: "/manga/one-piece" },
        { title: "Solo Leveling", url: "/manga/solo-leveling" },
        { title: "Jujutsu Kaisen", url: "/manga/jujutsu-kaisen" },
        { title: "Frieren: Beyond Journey's End", url: "/manga/frieren" },
        { title: "SPY×FAMILY", url: "/manga/spy-x-family" }
      ];

      const rawProtoBytes = createSyntheticBackupBytes(sampleTitles);
      const gzippedBytes = pako.gzip(rawProtoBytes);

      const parsed = await BackupParser.parseKomikkuBackup(gzippedBytes.buffer);

      const protoTests = [
        {
          name: 'Decompressed and parsed all 5 manga titles from GZIP Protobuf',
          fn: () => parsed.count === 5
        },
        {
          name: 'Extracted "One Piece" into lowercased title set',
          fn: () => parsed.titles.has("one piece")
        },
        {
          name: 'Extracted "Solo Leveling" into lowercased title set',
          fn: () => parsed.titles.has("solo leveling")
        },
        {
          name: 'Extracted "SPY×FAMILY" into lowercased title set',
          fn: () => parsed.titles.has("spy×family")
        }
      ];

      renderGroup("2. GZIP & Protobuf Parser Tests", protoTests);

      // 3. Comparison & Grouping Tests
      const mockTabs = [
        {
          id: 101,
          windowId: 1,
          title: "Read One Piece Chapter 1050 - Mangakakalot",
          url: "https://ww6.mangakakalot.tv/chapter/manga-aa951409/chapter-1050"
        },
        {
          id: 102,
          windowId: 1,
          title: "Ch. 142 - Jujutsu Kaisen - MangaDex",
          url: "https://mangadex.org/chapter/142"
        },
        {
          id: 103,
          windowId: 1,
          title: "Spy x Family - Chapter 75.5 - Read Manga Online Free",
          url: "https://mangapill.com/chapters/5176-10075500/spy-x-family-chapter-75-5"
        },
        {
          id: 104,
          windowId: 1,
          title: "Chainsaw Man Chapter 120 | MangaPlus",
          url: "https://mangaplus.shueisha.co.jp/viewer/1015600"
        },
        {
          id: 105,
          windowId: 1,
          title: "Read Berserk Manga Online in High Quality - ReadBerserk",
          url: "https://readberserk.com/chapter/berserk-chapter-370"
        },
        {
          id: 106,
          windowId: 1,
          title: "Love and Risk - Chapter 1 - Online Free",
          url: "https://example.com/love-and-risk"
        }
      ];

      // Add edge-case noise titles (like "N", "Love", "C") to test false positive resistance
      const extendedTitles = new Set(parsed.titles);
      extendedTitles.add("n");
      extendedTitles.add("c");
      extendedTitles.add("love");

      const comparison = MangaMatcher.compareTabsWithLibrary(mockTabs, extendedTitles);

      const comparisonTests = [
        {
          name: 'Total checked tabs equals 6',
          fn: () => comparison.totalTabs === 6
        },
        {
          name: 'Found 3 manga already in library (One Piece, Jujutsu Kaisen, Spy x Family)',
          fn: () => comparison.foundCount === 3
        },
        {
          name: 'Identified 3 missing manga (Chainsaw Man, Berserk, Love and Risk)',
          fn: () => comparison.missingCount === 3
        },
        {
          name: 'Crucial: "Love and Risk" is NOT falsely matched by "Love" or "N"',
          fn: () => comparison.missing.some(m => m.cleanedTitle.includes("love and risk"))
        },
        {
          name: 'Grouped missing by domain "mangaplus.shueisha.co.jp", "readberserk.com", and "example.com"',
          fn: () => {
            const domains = Object.keys(comparison.missingByDomain);
            return domains.includes('mangaplus.shueisha.co.jp') && domains.includes('readberserk.com') && domains.includes('example.com');
          }
        },
        {
          name: 'Domain extraction stripped "www." properly',
          fn: () => {
            const d = TitleCleaner.extractDomain("https://www.mangakakalot.com/manga");
            return d === "mangakakalot.com";
          }
        }
      ];

      renderGroup("3. Cross-Referencing & Domain Grouping Tests", comparisonTests);

      // 4. Backup Export and Protobuf Splicing Tests
      const missingToAdd = [
        {
          cleanedTitle: "Chainsaw Man",
          url: "https://mangaplus.shueisha.co.jp/viewer/1015600",
          domain: "mangaplus.shueisha.co.jp"
        },
        {
          cleanedTitle: "Love and Risk",
          url: "https://weebcentral.com/series/love-and-risk",
          domain: "weebcentral.com"
        }
      ];

      const exportResult = await BackupParser.exportUpdatedBackup(gzippedBytes.buffer, missingToAdd);
      const reParsed = await BackupParser.parseKomikkuBackup(exportResult.compressedBytes.buffer);

      const exportTests = [
        {
          name: 'exportUpdatedBackup produced compressed byte stream and blob',
          fn: () => exportResult.compressedBytes.length > 0 && exportResult.blob instanceof Blob
        },
        {
          name: 'Correctly added exactly 2 missing manga',
          fn: () => exportResult.addedCount === 2
        },
        {
          name: 'Re-parsed backup count increased from 5 to 7',
          fn: () => reParsed.count === 7
        },
        {
          name: 'Newly added "Chainsaw Man" is now present in re-parsed library',
          fn: () => reParsed.titles.has("chainsaw man")
        },
        {
          name: 'Newly added "Love and Risk" is now present in re-parsed library',
          fn: () => reParsed.titles.has("love and risk")
        },
        {
          name: 'Original manga "One Piece" remains preserved in re-parsed library',
          fn: () => reParsed.titles.has("one piece")
        },
        {
          name: 'Domain resolution matched Weeb Central to ID 2131019126180322627',
          fn: () => {
            const src = BackupParser.resolveSourceForDomain("weebcentral.com");
            return src.id === "2131019126180322627";
          }
        },
        {
          name: 'Domain resolution generated stable positive 64-bit ID for new domain',
          fn: () => {
            const src = BackupParser.resolveSourceForDomain("customnewsource.org");
            return src.isNew === true && BigInt(src.id) > 0n;
          }
        }
      ];

      renderGroup("4. Backup Export & Protobuf Splicing Tests", exportTests);

      // 5. Selective Manga Export Tests
      const allDetectedMissing = [
        { id: 101, cleanedTitle: "Chainsaw Man", url: "https://example.com/cm", domain: "example.com" },
        { id: 102, cleanedTitle: "Berserk", url: "https://example.com/berserk", domain: "example.com" },
        { id: 103, cleanedTitle: "Love and Risk", url: "https://example.com/lar", domain: "example.com" },
        { id: 104, cleanedTitle: "Dandadan", url: "https://example.com/dandadan", domain: "example.com" }
      ];

      // Simulate user selecting only Berserk (102) and Dandadan (104)
      const userSelectedIds = new Set([102, 104]);
      const selectedToExport = allDetectedMissing.filter(m => userSelectedIds.has(m.id));

      const selectiveExportResult = await BackupParser.exportUpdatedBackup(gzippedBytes.buffer, selectedToExport);
      const selectiveParsed = await BackupParser.parseKomikkuBackup(selectiveExportResult.compressedBytes.buffer);

      const selectiveTests = [
        {
          name: 'Filter correctly selected 2 of 4 missing manga based on user selection set',
          fn: () => selectedToExport.length === 2 && selectedToExport.map(m => m.cleanedTitle).join(',') === 'Berserk,Dandadan'
        },
        {
          name: 'Selective export added exactly 2 manga',
          fn: () => selectiveExportResult.addedCount === 2
        },
        {
          name: 'Selected "Berserk" is present in exported backup',
          fn: () => selectiveParsed.titles.has("berserk")
        },
        {
          name: 'Selected "Dandadan" is present in exported backup',
          fn: () => selectiveParsed.titles.has("dandadan")
        },
        {
          name: 'Unselected "Chainsaw Man" is NOT added to exported backup',
          fn: () => !selectiveParsed.titles.has("chainsaw man")
        },
        {
          name: 'Unselected "Love and Risk" is NOT added to exported backup',
          fn: () => !selectiveParsed.titles.has("love and risk")
        },
        {
          name: 'Original backup entries remain preserved in selective backup',
          fn: () => selectiveParsed.titles.has("one piece") && selectiveParsed.count === 7 // 5 original + 2 selected
        }
      ];

      renderGroup("5. Selective Manga Export Tests", selectiveTests);

      // 6. 64-Bit Source ID Precision & URL Extraction Tests
      const comixId = "7537715367149829912";
      const encodedSourcePayload = BackupParser.createBackupSourcePayload("Comix", comixId);
      const parsedSources = BackupParser.parseBackupSources(new Uint8Array(encodedSourcePayload));
      const resolvedComix = BackupParser.resolveSourceForDomain("comix.to", parsedSources);

      const sourceTests = [
        {
          name: 'readVarintBigInt decodes 64-bit ID (> 2^53) with zero precision loss',
          fn: () => {
            const encoded = BackupParser.writeVarint(comixId);
            const [decoded] = BackupParser.readVarintBigInt(encoded, 0);
            return decoded.toString() === comixId;
          }
        },
        {
          name: 'parseBackupSources accurately preserves Comix 64-bit ID "7537715367149829912"',
          fn: () => parsedSources.byName.get("comix") === comixId
        },
        {
          name: 'resolveSourceForDomain resolves "comix.to" to exact Komikku source ID',
          fn: () => resolvedComix.name === "Comix" && resolvedComix.id === comixId
        },
        {
          name: 'extractMangaUrl strips /title prefix for Comix to prevent title/title 404',
          fn: () => {
            const rel = BackupParser.extractMangaUrl("https://comix.to/title/60kxg-love-and-risk", "comix.to");
            return rel === "/60kxg-love-and-risk";
          }
        },
        {
          name: 'extractMangaUrl strips both chapter segment and /title prefix for Comix reader tabs',
          fn: () => {
            const rel = BackupParser.extractMangaUrl("https://comix.to/title/60kxg-love-and-risk/chapter-1", "comix.to");
            return rel === "/60kxg-love-and-risk";
          }
        },
        {
          name: 'extractMangaUrl strips /<chapterId>-chapter-<num> for Comix multi-segment chapter URLs',
          fn: () => {
            const chapterUrl = "https://comix.to/title/20kz5-i-reincarnated-as-a-lazy-villainous-prince-and-built-an-evil-boob-kingdom-i-was-living-freely-in-the-game-world-so-why-wont-the-beautiful-girls-leave-me-alone/11452354-chapter-1";
            const rel = BackupParser.extractMangaUrl(chapterUrl, "comix.to");
            return rel === "/20kz5-i-reincarnated-as-a-lazy-villainous-prince-and-built-an-evil-boob-kingdom-i-was-living-freely-in-the-game-world-so-why-wont-the-beautiful-girls-leave-me-alone";
          }
        },
        {
          name: 'cleanTabTitle isolates manga title from chapter page tab title',
          fn: () => {
            const tabTitle = "I Reincarnated as a Lazy Villainous Prince - Chapter 1 - Comix";
            const cleaned = TitleCleaner.cleanTabTitle(tabTitle, "https://comix.to/title/20kz5-slug/11452354-chapter-1");
            return cleaned === "i reincarnated as a lazy villainous prince";
          }
        },
        {
          name: 'cleanTabTitle strips middle dot "· Ch.39" and isolates title',
          fn: () => {
            const raw = "Betrayed by the Hero, I Formed a MILF Party With His Mom! · Ch.39";
            const cleaned = TitleCleaner.cleanTabTitle(raw, "https://comix.to/title/123");
            return cleaned === "betrayed by the hero, i formed a milf party with his mom!";
          }
        },
        {
          name: 'cleanTabTitle preserves original casing when preserveCase option is true',
          fn: () => {
            const raw = "Betrayed by the Hero, I Formed a MILF Party With His Mom! · Ch.39";
            const displayTitle = TitleCleaner.cleanTabTitle(raw, "https://comix.to/title/123", true);
            return displayTitle === "Betrayed by the Hero, I Formed a MILF Party With His Mom!";
          }
        },
        {
          name: 'cleanTabTitle cleans "Jujutsu Kaisen chapter 33" preserving casing with preserveCase',
          fn: () => {
            const raw = "Jujutsu Kaisen chapter 33";
            const display = TitleCleaner.cleanTabTitle(raw, "", true);
            const lower = TitleCleaner.cleanTabTitle(raw, "");
            return display === "Jujutsu Kaisen" && lower === "jujutsu kaisen";
          }
        }
      ];

      renderGroup("6. 64-Bit Source ID Precision Tests", sourceTests);

      // 7. Library Entries & Source Resolution Tests
      const mangadexId = "2499283573021220255";
      const customSourceId = "998877665544332211";
      const sourcePayload7 = BackupParser.createBackupSourcePayload("Custom Scans", customSourceId);
      const mangaPayload7a = BackupParser.createBackupMangaPayload({
        title: "Chainsaw Man",
        url: "/title/chainsaw-man",
        sourceId: mangadexId,
        dateAdded: 1600000000000
      });
      const mangaPayload7b = BackupParser.createBackupMangaPayload({
        title: "Dandadan",
        url: "/title/dandadan",
        sourceId: customSourceId,
        dateAdded: 1600000000000
      });

      const backupBytes7 = new Uint8Array([...sourcePayload7, ...mangaPayload7a, ...mangaPayload7b]);
      const compressed7 = await BackupParser.compressGzip(backupBytes7);
      const parsed7 = await BackupParser.parseKomikkuBackup(compressed7);

      const libraryEntryTests = [
        {
          name: 'parseKomikkuBackup extracts entries array with title, url, sourceId, and sourceName',
          fn: () => {
            return Array.isArray(parsed7.entries) && parsed7.entries.length === 2 &&
                   parsed7.entries.some(e => e.title === "Chainsaw Man" && e.sourceName === "MangaDex");
          }
        },
        {
          name: 'parseKomikkuBackup resolves registered custom BackupSource name "Custom Scans"',
          fn: () => {
            const dandadan = parsed7.entries.find(e => e.title === "Dandadan");
            return dandadan && dandadan.sourceName === "Custom Scans" && dandadan.sourceId === customSourceId;
          }
        },
        {
          name: 'parseKomikkuBackup preserves URL path on extracted entries',
          fn: () => {
            const csm = parsed7.entries.find(e => e.title === "Chainsaw Man");
            return csm && csm.url === "/title/chainsaw-man";
          }
        }
      ];

      renderGroup("7. Library Entries & Source Extraction Tests", libraryEntryTests);

      // 8. Duplicate Detection & Title Normalization Tests
      const dupEntriesMock = [
        // Group 1: Cross-source duplicates
        { title: "Solo Leveling", sourceName: "MangaDex", sourceId: "1", url: "/manga/1" },
        { title: "Solo Leveling [Official]", sourceName: "Webtoons.com", sourceId: "2", url: "/comic/2" },
        { title: "Solo Leveling (Colored)", sourceName: "Asura Scans", sourceId: "3", url: "/series/3" },

        // Group 2: Same-source duplicates
        { title: "One Piece", sourceName: "Comix", sourceId: "4", url: "/title/op-1" },
        { title: "One Piece [Digital Colored]", sourceName: "Comix", sourceId: "4", url: "/title/op-2" },

        // Group 3: Special character / cross-representation match
        { title: "SPY × FAMILY", sourceName: "MangaDex", sourceId: "1", url: "/manga/spy1" },
        { title: "SPY x FAMILY", sourceName: "MangaFire", sourceId: "5", url: "/manga/spy2" },

        // Single unique title (not a duplicate)
        { title: "Berserk", sourceName: "MangaDex", sourceId: "1", url: "/manga/berserk" }
      ];

      const dupResults = BackupParser.findDuplicateTitles(dupEntriesMock);
      const soloGroup = dupResults.groups.find(g => g.key === "solo leveling");
      const opGroup = dupResults.groups.find(g => g.key === "one piece");
      const spyGroup = dupResults.groups.find(g => g.key === "spy x family");

      const duplicateTests = [
        {
          name: 'getNormalizedDuplicateKey removes bracket tags "[Official]" and "(Colored)"',
          fn: () => {
            const k1 = BackupParser.getNormalizedDuplicateKey("Solo Leveling");
            const k2 = BackupParser.getNormalizedDuplicateKey("Solo Leveling [Official]");
            const k3 = BackupParser.getNormalizedDuplicateKey("Solo Leveling (Colored)");
            return k1 === "solo leveling" && k2 === "solo leveling" && k3 === "solo leveling";
          }
        },
        {
          name: 'getNormalizedDuplicateKey equates multiplication sign "×" with "x"',
          fn: () => {
            const k1 = BackupParser.getNormalizedDuplicateKey("SPY × FAMILY");
            const k2 = BackupParser.getNormalizedDuplicateKey("SPY x FAMILY");
            return k1 === "spy x family" && k2 === "spy x family";
          }
        },
        {
          name: 'findDuplicateTitles identifies Cross-Source duplicate group ("Solo Leveling" across 3 sources)',
          fn: () => soloGroup && soloGroup.count === 3 && soloGroup.isSameSource === false && soloGroup.sources.length === 3
        },
        {
          name: 'findDuplicateTitles identifies Same-Source duplicate group ("One Piece" both on Comix)',
          fn: () => opGroup && opGroup.count === 2 && opGroup.isSameSource === true && opGroup.sources.length === 1
        },
        {
          name: 'findDuplicateTitles matches "SPY × FAMILY" and "SPY x FAMILY" as duplicates',
          fn: () => spyGroup && spyGroup.count === 2
        },
        {
          name: 'findDuplicateTitles excludes unique manga ("Berserk") from duplicates count',
          fn: () => !dupResults.groups.some(g => g.key === "berserk")
        },
        {
          name: 'findDuplicateTitles accurately counts same-source and cross-source groups',
          fn: () => dupResults.duplicateGroupsCount === 3 &&
                    dupResults.sameSourceGroupsCount === 1 &&
                    dupResults.crossSourceGroupsCount === 2 &&
                    dupResults.totalDuplicatesCount === 4 // (3-1) + (2-1) + (2-1) = 4 redundant copies
        }
      ];

      renderGroup("8. Duplicate Detection & Normalization Tests", duplicateTests);

      // 9. dateAdded Extraction & Formatting Tests
      const timestampTest1 = 1700000000000; // Nov 14, 2023
      const timestampTest2 = 1720000000000; // Jul 3, 2024
      const mangaPayload9a = BackupParser.createBackupMangaPayload({
        title: "Test Manga Old",
        url: "/test/old",
        sourceId: "123",
        dateAdded: timestampTest1
      });
      const mangaPayload9b = BackupParser.createBackupMangaPayload({
        title: "Test Manga New",
        url: "/test/new",
        sourceId: "456",
        dateAdded: timestampTest2
      });

      const backupBytes9 = new Uint8Array([...mangaPayload9a, ...mangaPayload9b]);
      const compressed9 = await BackupParser.compressGzip(backupBytes9);
      const parsed9 = await BackupParser.parseKomikkuBackup(compressed9);

      const dateTests = [
        {
          name: 'parseStructuredProtobuf extracts dateAdded (Field 13) timestamp correctly',
          fn: () => {
            const oldEntry = parsed9.entries.find(e => e.title === "Test Manga Old");
            const newEntry = parsed9.entries.find(e => e.title === "Test Manga New");
            return oldEntry && oldEntry.dateAdded === timestampTest1 &&
                   newEntry && newEntry.dateAdded === timestampTest2;
          }
        },
        {
          name: 'formatDate converts timestamp to readable date string and handles 0 gracefully',
          fn: () => {
            const formatted = BackupParser.formatDate(timestampTest1);
            const emptyFormatted = BackupParser.formatDate(0);
            return typeof formatted === 'string' && formatted.length > 4 && emptyFormatted === 'Unknown date';
          }
        }
      ];

      renderGroup("9. Date Added Extraction & Formatting Tests", dateTests);

      // 10. Duplicate Selection & Prioritization Tests
      const sampleDupGroups = [
        {
          key: "vinland saga",
          canonicalTitle: "Vinland Saga",
          count: 3,
          entries: [
            { id: "e1", entryIndex: 0, title: "Vinland Saga", sourceName: "MangaKakalot", dateAdded: 1620000000000, formattedDate: "May 3, 2021" },
            { id: "e2", entryIndex: 1, title: "Vinland Saga", sourceName: "Comix", dateAdded: 1610000000000, formattedDate: "Jan 7, 2021" },
            { id: "e3", entryIndex: 2, title: "Vinland Saga", sourceName: "WeebCentral", dateAdded: 1630000000000, formattedDate: "Aug 27, 2021" }
          ]
        },
        {
          key: "hunter x hunter",
          canonicalTitle: "Hunter x Hunter",
          count: 2,
          entries: [
            { id: "e4", entryIndex: 3, title: "Hunter x Hunter", sourceName: "UnknownSource", dateAdded: 1650000000000, formattedDate: "Apr 15, 2022" },
            { id: "e5", entryIndex: 4, title: "Hunter x Hunter", sourceName: "WeebCentral", dateAdded: 1660000000000, formattedDate: "Aug 9, 2022" }
          ]
        }
      ];

      // Test 10.1: Source Preference rule: [Comix, WeebCentral, MangaKakalot]
      const prefOrder = ["Comix", "WeebCentral", "MangaKakalot"];
      BackupParser.applyDuplicateSelectionRule(sampleDupGroups, "sourcePreference", { sourcePreferences: prefOrder });

      const ruleTests = [
        {
          name: 'applyDuplicateSelectionRule by sourcePreference selects highest priority source (Comix) as keep',
          fn: () => {
            const g1 = sampleDupGroups[0];
            const comixEntry = g1.entries.find(e => e.sourceName === "Comix");
            return comixEntry && comixEntry.isKeep === true && comixEntry.isSelectedForDelete === false;
          }
        },
        {
          name: 'applyDuplicateSelectionRule marks lower priority sources (WeebCentral, MangaKakalot) for deletion',
          fn: () => {
            const g1 = sampleDupGroups[0];
            const weeb = g1.entries.find(e => e.sourceName === "WeebCentral");
            const kaka = g1.entries.find(e => e.sourceName === "MangaKakalot");
            return weeb && weeb.isSelectedForDelete === true && kaka && kaka.isSelectedForDelete === true;
          }
        },
        {
          name: 'Unranked sources fall back to lower priority than ranked sources',
          fn: () => {
            const g2 = sampleDupGroups[1];
            const weeb = g2.entries.find(e => e.sourceName === "WeebCentral");
            const unranked = g2.entries.find(e => e.sourceName === "UnknownSource");
            return weeb && weeb.isKeep === true && unranked && unranked.isSelectedForDelete === true;
          }
        },
        {
          name: 'applyDuplicateSelectionRule by oldest keeps entry with lowest dateAdded',
          fn: () => {
            BackupParser.applyDuplicateSelectionRule(sampleDupGroups, "oldest");
            const g1 = sampleDupGroups[0];
            const oldest = g1.entries.find(e => e.sourceName === "Comix"); // Jan 2021 is oldest
            return oldest && oldest.isKeep === true && g1.entries.filter(e => e.isSelectedForDelete).length === 2;
          }
        },
        {
          name: 'applyDuplicateSelectionRule by newest keeps entry with highest dateAdded',
          fn: () => {
            BackupParser.applyDuplicateSelectionRule(sampleDupGroups, "newest");
            const g1 = sampleDupGroups[0];
            const newest = g1.entries.find(e => e.sourceName === "WeebCentral"); // Aug 2021 is newest
            return newest && newest.isKeep === true && g1.entries.filter(e => e.isSelectedForDelete).length === 2;
          }
        },
        {
          name: 'applyDuplicateSelectionRule always preserves exactly 1 keep entry per duplicate group',
          fn: () => {
            return sampleDupGroups.every(g => g.entries.filter(e => e.isKeep).length === 1 && g.entries.filter(e => e.isSelectedForDelete).length === (g.entries.length - 1));
          }
        }
      ];

      renderGroup("10. Duplicate Selection & Prioritization Tests", ruleTests);

      // 11. Binary Backup Deletion & Cleanup Tests
      // Let's create a backup with 3 manga: One Piece (e1), One Piece duplicate (e2), Naruto (e3)
      const mangaA = BackupParser.createBackupMangaPayload({ title: "One Piece", url: "/op/1", sourceId: "1", dateAdded: 1600000000000 });
      const mangaB = BackupParser.createBackupMangaPayload({ title: "One Piece", url: "/op/2", sourceId: "2", dateAdded: 1610000000000 });
      const mangaC = BackupParser.createBackupMangaPayload({ title: "Naruto", url: "/naruto/1", sourceId: "1", dateAdded: 1600000000000 });

      const initialBackupBytes = new Uint8Array([...mangaA, ...mangaB, ...mangaC]);
      const initialCompressed = await BackupParser.compressGzip(initialBackupBytes);
      const initialParsed = await BackupParser.parseKomikkuBackup(initialCompressed);

      // Now remove the duplicate mangaB
      const duplicateToRemove = initialParsed.entries.find(e => e.title === "One Piece" && e.sourceId === "2");
      const cleanupResult = await BackupParser.removeEntriesFromBackup(initialCompressed, [duplicateToRemove]);
      const reParsedAfterCleanup = await BackupParser.parseKomikkuBackup(cleanupResult.compressedBytes);

      const cleanupTests = [
        {
          name: 'removeEntriesFromBackup successfully removes duplicate record from byte stream',
          fn: () => cleanupResult.removedCount === 1 && cleanupResult.blob instanceof Blob
        },
        {
          name: 'Re-parsed backup total count decreases from 3 to 2',
          fn: () => reParsedAfterCleanup.count === 2
        },
        {
          name: 'Deleted duplicate entry is completely absent in cleaned backup',
          fn: () => !reParsedAfterCleanup.entries.some(e => e.title === "One Piece" && e.sourceId === "2")
        },
        {
          name: 'Original "One Piece" copy and "Naruto" remain completely intact and valid',
          fn: () => {
            const remainingOP = reParsedAfterCleanup.entries.find(e => e.title === "One Piece");
            const remainingNaruto = reParsedAfterCleanup.entries.find(e => e.title === "Naruto");
            return remainingOP && remainingOP.sourceId === "1" && remainingNaruto && remainingNaruto.sourceId === "1";
          }
        },
        {
          name: 'Cleaned backup has 0 duplicates remaining for One Piece',
          fn: () => reParsedAfterCleanup.duplicates.duplicateGroupsCount === 0
        }
      ];

      renderGroup("11. Binary Backup Deletion & Cleanup Tests", cleanupTests);

      // 12. Category Extraction, Assignment & Organization Tests
      const catA = BackupParser.createBackupCategoryPayload("Action / Shonen", 0);
      const catB = BackupParser.createBackupCategoryPayload("Romance", 1);
      const catC = BackupParser.createBackupCategoryPayload("Favorites", 2);

      // Manga 1: In catA and catC (multiple categories)
      const mangaCat1 = BackupParser.createBackupMangaPayload({
        title: "Chainsaw Man",
        url: "/csm/1",
        sourceId: "1",
        categories: [0, 2]
      });
      // Manga 2: In catB only
      const mangaCat2 = BackupParser.createBackupMangaPayload({
        title: "Kaguya-sama",
        url: "/kaguya/1",
        sourceId: "1",
        categories: [1]
      });
      // Manga 3: In catC only
      const mangaCat3 = BackupParser.createBackupMangaPayload({
        title: "Frieren",
        url: "/frieren/1",
        sourceId: "1",
        categories: [2]
      });
      // Manga 4: Uncategorized (empty categories array)
      const mangaCat4 = BackupParser.createBackupMangaPayload({
        title: "One Punch Man",
        url: "/opm/1",
        sourceId: "1",
        categories: []
      });

      const catBackupBytes = new Uint8Array([...catA, ...catB, ...catC, ...mangaCat1, ...mangaCat2, ...mangaCat3, ...mangaCat4]);
      const catCompressed = await BackupParser.compressGzip(catBackupBytes);
      const catParsed = await BackupParser.parseKomikkuBackup(catCompressed);

      const categoryTests = [
        {
          name: 'Decoded all 3 backup categories in ascending order by order property',
          fn: () => {
            return catParsed.categories.length === 3 &&
              catParsed.categories[0].name === "Action / Shonen" && catParsed.categories[0].order === 0 &&
              catParsed.categories[1].name === "Romance" && catParsed.categories[1].order === 1 &&
              catParsed.categories[2].name === "Favorites" && catParsed.categories[2].order === 2;
          }
        },
        {
          name: 'Category counts accurately reflect assignments including overlap',
          fn: () => {
            const cAction = catParsed.categories.find(c => c.name === "Action / Shonen");
            const cRomance = catParsed.categories.find(c => c.name === "Romance");
            const cFav = catParsed.categories.find(c => c.name === "Favorites");
            return cAction && cAction.count === 1 &&
                   cRomance && cRomance.count === 1 &&
                   cFav && cFav.count === 2;
          }
        },
        {
          name: 'Multi-category manga appears assigned to all its respective categories',
          fn: () => {
            const csm = catParsed.entries.find(e => e.title === "Chainsaw Man");
            return csm &&
                   csm.categoryNames.includes("Action / Shonen") &&
                   csm.categoryNames.includes("Favorites") &&
                   csm.categories.includes(0) &&
                   csm.categories.includes(2) &&
                   csm.isUncategorized === false;
          }
        },
        {
          name: 'Uncategorized manga is marked isUncategorized and accurately counted',
          fn: () => {
            const opm = catParsed.entries.find(e => e.title === "One Punch Man");
            return opm && opm.isUncategorized === true && opm.categoryNames.length === 0 && catParsed.uncategorizedCount === 1;
          }
        },
        {
          name: 'Backup without categories reports 0 categories and marks all manga uncategorized',
          fn: () => {
            return initialParsed.categories.length === 0 &&
                   initialParsed.uncategorizedCount === initialParsed.entries.length &&
                   initialParsed.entries.every(e => e.isUncategorized);
          }
        }
      ];

      renderGroup("12. Category Extraction, Assignment & Organization Tests", categoryTests);

      // 13. Category Filtering & Multi-Category Integrity Tests
      const filterByCategory = (entries, categoryName) => {
        if (categoryName === 'all') return entries;
        if (categoryName === '__uncategorized__') {
          return entries.filter(e => e.isUncategorized || !e.categoryNames || e.categoryNames.length === 0);
        }
        return entries.filter(e => Array.isArray(e.categoryNames) && e.categoryNames.includes(categoryName));
      };

      const actionList = filterByCategory(catParsed.entries, "Action / Shonen");
      const favoritesList = filterByCategory(catParsed.entries, "Favorites");
      const romanceList = filterByCategory(catParsed.entries, "Romance");
      const uncatList = filterByCategory(catParsed.entries, "__uncategorized__");

      const categoryFilterTests = [
        {
          name: 'Filtering by "Action / Shonen" returns Chainsaw Man without extra items',
          fn: () => actionList.length === 1 && actionList[0].title === "Chainsaw Man"
        },
        {
          name: 'Filtering by "Favorites" returns both Chainsaw Man and Frieren',
          fn: () => favoritesList.length === 2 && favoritesList.some(e => e.title === "Chainsaw Man") && favoritesList.some(e => e.title === "Frieren")
        },
        {
          name: 'Filtering by "Romance" returns Kaguya-sama',
          fn: () => romanceList.length === 1 && romanceList[0].title === "Kaguya-sama"
        },
        {
          name: 'Filtering by "__uncategorized__" returns One Punch Man only',
          fn: () => uncatList.length === 1 && uncatList[0].title === "One Punch Man"
        },
        {
          name: 'Multi-category manga ("Chainsaw Man") appears in both Category views without duplicate underlying records',
          fn: () => {
            const inAction = actionList.find(e => e.title === "Chainsaw Man");
            const inFavorites = favoritesList.find(e => e.title === "Chainsaw Man");
            return inAction && inFavorites && inAction === inFavorites && catParsed.entries.length === 4;
          }
        },
        {
          name: 'Empty categories condition correctly detected for category-less backups',
          fn: () => initialParsed.categories.length === 0 && initialParsed.entries.every(e => e.isUncategorized)
        }
      ];

      renderGroup("13. Category Filtering & Multi-Category Integrity Tests", categoryFilterTests);

      // Final Summary
      const summaryBox = document.createElement('div');
      const allPassed = passedTests === totalTests;
      summaryBox.className = `summary ${allPassed ? 'all-passed' : 'some-failed'}`;
      summaryBox.textContent = `Test Results: ${passedTests} / ${totalTests} tests passed (${allPassed ? '100% SUCCESS' : 'FAILURES DETECTED'})`;
      resultsContainer.prepend(summaryBox);
    }

    runProtobufTests();
  </script>
</body>
</html>
