<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5370"/>
      <stop offset="100%" stop-color="#ff7643"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff5370" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Manga Book Back -->
  <path d="M 28 32 C 28 32, 48 30, 64 36 C 80 30, 100 32, 100 32 L 100 90 C 84 85, 68 87, 64 92 C 60 87, 44 85, 28 90 Z" fill="#252936" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Manga Book Left Page with manga speed lines -->
  <path d="M 28 32 C 28 32, 46 30, 64 36 L 64 92 C 50 87, 36 86, 28 90 Z" fill="#2c3244"/>
  <line x1="36" y1="44" x2="56" y2="46" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="54" x2="56" y2="56" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="64" x2="52" y2="66" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>

  <!-- Manga Book Right Page (Accent) -->
  <path d="M 64 36 C 82 30, 100 32, 100 32 L 100 90 C 92 86, 78 87, 64 92 Z" fill="url(#coralGrad)" filter="url(#shadow)"/>
  
  <!-- Right Page Panels / Illustration Lines -->
  <rect x="72" y="42" width="20" height="18" rx="3" fill="rgba(255,255,255,0.2)"/>
  <line x1="72" y1="68" x2="92" y2="68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="76" x2="86" y2="76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Spine Bookmark / Sparkle -->
  <path d="M 61 24 L 67 24 L 67 48 L 64 45 L 61 48 Z" fill="url(#cyanGrad)"/>
  
  <!-- Checkmark / Comparison Badge in bottom right -->
  <circle cx="94" cy="94" r="16" fill="#10b981" stroke="#0e1017" stroke-width="3"/>
  <path d="M 88 94 L 92 98 L 100 89" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
